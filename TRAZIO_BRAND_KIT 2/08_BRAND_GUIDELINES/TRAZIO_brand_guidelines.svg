<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1980" viewBox="0 0 1400 1980"><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".22"/></filter><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2991FF"/><stop offset=".55" stop-color="#126BFF"/><stop offset="1" stop-color="#084BCB"/></linearGradient><linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#C5CFDD"/></linearGradient></defs><rect width="1400" height="1980" fill="#FFFFFF"/><rect width="1400" height="460" fill="#08111F"/><g transform="translate(110 90) scale(2.35)" filter="url(#shadow)"><path fill="url(#blue)" d="M0 30 96 8 48 82 57 43 13 54Z"/><path fill="#0C57E6" d="M0 30 13 54 48 43 96 8Z" opacity=".9"/><path fill="#0750D8" d="M48 82 57 43 48 43 36 96Z"/><path fill="url(#ice)" d="M31 55 55 48 36 96 20 101 20 68Z"/><path fill="#D6DEEA" d="M20 68 31 55 36 96 20 101Z"/></g><text x="390" y="194.92000000000002" font-family="Arial, Helvetica, sans-serif" font-size="69.92" font-weight="700" letter-spacing="6.44" fill="#FFFFFF">TRAZIO</text><text x="394.6" y="212.4" font-family="Arial, Helvetica, sans-serif" font-size="14.72" font-weight="600" letter-spacing="3.68" fill="#126BFF">DIGITAL GROWTH STUDIO</text><text x="115" y="395" font-family="Arial" font-size="25" letter-spacing="4" fill="#E9EEF5">BRAND GUIDELINES · VERSIONE 1.0 · LUGLIO 2026</text>
<text x="110" y="580" font-family="Arial" font-size="38" font-weight="700" fill="#0B1320">Il concetto</text><text x="110" y="630" font-family="Arial" font-size="22" fill="#0B1320">TRAZIO nasce dalla trazione: la forza che rende visibile una crescita concreta.</text><text x="110" y="665" font-family="Arial" font-size="22" fill="#0B1320">Il simbolo unisce una T strutturale e una freccia verso l’alto: direzione, tecnologia, progresso.</text>
<text x="110" y="790" font-family="Arial" font-size="34" font-weight="700" fill="#0B1320">Palette ufficiale</text><circle cx="180" cy="900" r="52" fill="#126BFF"/><circle cx="410" cy="900" r="52" fill="#08111F"/><circle cx="640" cy="900" r="52" fill="#E9EEF5"/><circle cx="870" cy="900" r="52" fill="#0B1320"/><text x="110" y="995" font-family="Arial" font-size="19" fill="#0B1320">Electric Blue · #126BFF · RGB 18 107 255 · CMYK 93 58 0 0</text><text x="110" y="1030" font-family="Arial" font-size="19" fill="#0B1320">Deep Navy · #08111F · RGB 8 17 31 · CMYK 74 45 0 88</text><text x="110" y="1065" font-family="Arial" font-size="19" fill="#0B1320">Ice Grey · #E9EEF5 · RGB 233 238 245 · CMYK 5 3 0 4</text><text x="110" y="1100" font-family="Arial" font-size="19" fill="#0B1320">Ink · #0B1320 · RGB 11 19 32 · CMYK 66 41 0 87</text>
<text x="110" y="1210" font-family="Arial" font-size="34" font-weight="700" fill="#0B1320">Tipografia</text><text x="110" y="1260" font-family="Arial" font-size="27" font-weight="700" fill="#126BFF">Poppins · titoli / CTA</text><text x="110" y="1300" font-family="Arial" font-size="24" fill="#0B1320">Inter · testo / UI</text><text x="110" y="1350" font-family="Arial" font-size="18" fill="#AEB8C8">H1 56-72 px · H2 36-44 px · Body 16-18 px · Eyebrow 12-14 px con tracking.</text>
<text x="110" y="1460" font-family="Arial" font-size="34" font-weight="700" fill="#0B1320">Uso del logo</text><text x="110" y="1510" font-family="Arial" font-size="19" fill="#0B1320">Mantieni spazio libero pari all’altezza della punta della freccia (X). Dimensione minima: 24 px simbolo, 140 px logo orizzontale.</text><text x="110" y="1550" font-family="Arial" font-size="19" fill="#0B1320">Usa la versione chiara su fondi chiari e la versione bianca su fondi scuri. Mai deformare, ruotare, aggiungere ombre o cambiare la palette.</text><rect x="110" y="1620" width="1180" height="220" rx="22" fill="#08111F"/><g transform="translate(200 1660) scale(1.45)" filter="url(#shadow)"><path fill="url(#blue)" d="M0 30 96 8 48 82 57 43 13 54Z"/><path fill="#0C57E6" d="M0 30 13 54 48 43 96 8Z" opacity=".9"/><path fill="#0750D8" d="M48 82 57 43 48 43 36 96Z"/><path fill="url(#ice)" d="M31 55 55 48 36 96 20 101 20 68Z"/><path fill="#D6DEEA" d="M20 68 31 55 36 96 20 101Z"/></g><text x="410" y="1710" font-family="Arial" font-size="28" font-weight="700" fill="white">Diamo trazione al tuo business.</text><text x="410" y="1755" font-family="Arial" font-size="19" fill="#E9EEF5">Strategia, siti web, AI, CRM, automazioni e crescita digitale.</text><text x="110" y="1910" font-family="Arial" font-size="15" fill="#AEB8C8">TRAZIO · Digital Growth Studio · guida operativa essenziale</text></svg>